spring.application.name=seat-management-service
server.port=8084
spring.datasource.url=jdbc:h2:file:./data/seatdb;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=${SEAT_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
bus.service.url=${BUS_SERVICE_URL:http://localhost:8081}
services.internal-token=${INTERNAL_SERVICE_TOKEN}
services.connect-timeout-ms=3000
services.read-timeout-ms=5000
seats.reservation-duration=PT10M
seats.expiry-delay-ms=30000
seats.number-prefix=S
seats.expiry-enabled=true