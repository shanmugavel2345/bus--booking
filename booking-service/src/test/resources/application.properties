services.internal-token=test-internal-token
booking.seat-recovery-enabled=false
spring.application.name=bus_booking_test
spring.datasource.url=jdbc:h2:mem:booking-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.jpa.show-sql=false
spring.h2.console.enabled=false
booking.price-per-seat=500.00