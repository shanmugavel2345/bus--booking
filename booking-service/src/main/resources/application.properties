spring.application.name=bus_booking
server.port=8082
services.bus.url=${BUS_SERVICE_URL:http://localhost:8081}
seat.service.url=${SEAT_SERVICE_URL:http://localhost:8084}
services.internal-token=${INTERNAL_SERVICE_TOKEN}
services.connect-timeout-ms=3000
services.read-timeout-ms=5000
spring.datasource.url=jdbc:h2:file:./data/busdb;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
springdoc.swagger-ui.path=/swagger-ui.html
