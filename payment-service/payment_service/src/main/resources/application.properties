spring.application.name=payment-service
server.port=8083
spring.datasource.url=jdbc:h2:file:./data/paymentdb;MODE=PostgreSQL;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=${PAYMENT_DB_USERNAME:sa}
spring.datasource.password=${PAYMENT_DB_PASSWORD:}
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.jackson.deserialization.fail-on-unknown-properties=true
services.booking.url=${BOOKING_SERVICE_URL:http://localhost:8082}
services.internal-token=${INTERNAL_SERVICE_TOKEN}
services.connect-timeout-ms=3000
services.read-timeout-ms=5000
payments.simulation.success=${PAYMENT_SIMULATION_SUCCESS:true}